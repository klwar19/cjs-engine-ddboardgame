<section class="campaign-panel">
  <div class="campaign-panel-head">
    <div>
      <h2>Campaign Saves</h2>
      <div class="campaign-muted">Build save version <strong>7</strong> · Min compatible <strong>5</strong>
      </div>
    </div>
  </div>
  <div class="campaign-save-manager">
    <div class="campaign-save-actions">
      <button class="campaign-action primary">+ New Campaign Save</button>
      <button class="campaign-action">Save Now</button>
      <button class="campaign-action">Fork Current</button>
      <button class="campaign-action">Export Current</button>
      <button class="campaign-action">Import…</button>
      <button class="campaign-action danger">Delete All Saves</button>
    </div>
    <div class="campaign-save-slot-list">
      <div class="campaign-save-slot is-active">
        <div>
          <h4>Main</h4>
          <div class="campaign-save-meta">
            <span>World: haven</span>
            <span>Chapter Chapter 2 — Harborlight</span>
            <span>Saved 5/30/2026, 9:00:00 AM</span>
            <span>v7</span>
            <span>● Active</span>
          </div>
        </div>
        <div class="campaign-save-row-actions">
          <button class="campaign-action primary" disabled="">Loaded</button>
          <button class="campaign-action danger">Delete</button>
        </div>
      </div>
      <div class="campaign-save-slot is-incompatible">
        <div>
          <h4>Backup</h4>
          <div class="campaign-save-meta">
            <span>World: haven</span>
            <span>Chapter Chapter 1 — Arrival</span>
            <span>Saved 5/20/2026, 6:30:00 PM</span>
            <span>v4</span>
            <span class="is-warn">Incompatible</span>
          </div>
          <div class="campaign-muted" style="margin-top:6px">Saved on version 4, older than the minimum supported (5).</div>
        </div>
        <div class="campaign-save-row-actions">
          <button class="campaign-action" title="Export the old save before deleting">Export</button>
          <button class="campaign-action danger">Delete</button>
        </div>
      </div>
    </div>
  </div>
</section>
