<section class="campaign-panel">
  <div class="campaign-panel-head">
    <h2>Session Log</h2>
    <div class="campaign-panel-actions">
      <button class="campaign-action">Export Log</button>
      <button class="campaign-action danger">Clear Log</button>
    </div>
  </div>
  <div class="campaign-log-list">
    <div class="campaign-log-line campaign-log-phase">
      <div class="campaign-log-main">
        <span class="campaign-log-type">Phase</span>
        <span>Phase 5 begins.</span>
      </div>
      <small>Phase 5 | May 30, 09:00 AM</small>
    </div>
    <div class="campaign-log-line campaign-log-quest">
      <div class="campaign-log-main">
        <span class="campaign-log-type">Quest</span>
        <span>Recovered a moonpetal.</span>
      </div>
      <small>Phase 5 | May 30, 09:02 AM</small>
    </div>
    <div class="campaign-log-line campaign-log-system">
      <div class="campaign-log-main">
        <span class="campaign-log-type">Log</span>
        <span>Defeated a tidewater lurker.</span>
      </div>
      <small>Phase 5 | May 30, 09:05 AM</small>
    </div>
  </div>
</section>
