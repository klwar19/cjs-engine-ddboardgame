<article class="campaign-quest-card ">
  <div class="campaign-quest-main">
    <div class="campaign-quest-title-row">
      <strong>The Sunken Relic</strong>
      <span class="campaign-pill campaign-quest-status is-active">Active</span>
      <span class="campaign-pill campaign-muted-pill" title="No scenario yet — Map Run will generate one">no map yet</span>
    </div>
    <div class="campaign-muted">Active</div>
    <div class="campaign-muted">Recover the drowned relic from the tidewater ruins.</div>
    <div class="campaign-chip-row campaign-context-tags">
      <span class="campaign-chip">Main</span>
      <span class="campaign-chip">Ruins</span>
    </div>
    <div class="campaign-quest-phase">
      <span>Phase</span>
      <strong>Recover the relic</strong>
      <small>1/2</small>
    </div>
    <div class="campaign-quest-objectives">
      <div class="campaign-quest-objective is-done">
        <div>
          <strong>Reach the ruins</strong>
          <small>1/1</small>
        </div>
        <div class="campaign-quest-progress">
          <span style="width:100%">
          </span>
        </div>
      </div>
      <div class="campaign-quest-objective ">
        <div>
          <strong>Recover the relic</strong>
          <small>0/1</small>
        </div>
        <div class="campaign-quest-progress">
          <span style="width:0%">
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="campaign-quest-actions">
    <button class="campaign-action has-hint primary" title="Start (or generate) the map run for this quest">
      <span class="campaign-action-label">Map Run</span>
      <small class="campaign-action-hint">Start (or generate) the map run for this quest</small>
    </button>
    <button class="campaign-action has-hint" title="Tick an objective forward by 1">
      <span class="campaign-action-label">Progress</span>
      <small class="campaign-action-hint">Tick an objective forward by 1</small>
    </button>
    <details class="campaign-action-menu">
      <summary class="campaign-action-menu-trigger">
        <span>Quest Actions</span>
      </summary>
      <div class="campaign-action-menu-panel">
        <button class="campaign-action has-hint" title="Run a battle linked to this quest">
          <span class="campaign-action-label">Battle</span>
          <small class="campaign-action-hint">Run a battle linked to this quest</small>
        </button>
        <button class="campaign-action has-hint" title="Run one logical hub scene and tick an objective">
          <span class="campaign-action-label">Hub Scene</span>
          <small class="campaign-action-hint">Run one logical hub scene and tick an objective</small>
        </button>
        <button class="campaign-action has-hint" title="Manual harvest/gather progress with light loot">
          <span class="campaign-action-label">Harvest</span>
          <small class="campaign-action-hint">Manual harvest/gather progress with light loot</small>
        </button>
        <button class="campaign-action has-hint" title="Make a stat or skill check toward this quest">
          <span class="campaign-action-label">Check</span>
          <small class="campaign-action-hint">Make a stat or skill check toward this quest</small>
        </button>
        <button class="campaign-action has-hint" title="Deliver an item to complete an objective">
          <span class="campaign-action-label">Hand In</span>
          <small class="campaign-action-hint">Deliver an item to complete an objective</small>
        </button>
        <button class="campaign-action has-hint" title="Resolve a riddle / dialog objective">
          <span class="campaign-action-label">Answer</span>
          <small class="campaign-action-hint">Resolve a riddle / dialog objective</small>
        </button>
        <button class="campaign-action has-hint" title="Mark complete and grant rewards">
          <span class="campaign-action-label">Resolve</span>
          <small class="campaign-action-hint">Mark complete and grant rewards</small>
        </button>
        <button class="campaign-action has-hint danger" title="Mark failed (no rewards)">
          <span class="campaign-action-label">Fail</span>
          <small class="campaign-action-hint">Mark failed (no rewards)</small>
        </button>
      </div>
    </details>
  </div>
</article>
