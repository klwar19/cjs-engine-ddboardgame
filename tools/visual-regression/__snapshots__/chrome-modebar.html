<div class="campaign-modes">
  <div class="campaign-modes-primary">
    <button class="campaign-mode-btn active">
      <span class="campaign-mode-icon">📖</span>
      <span>Story</span>
    </button>
    <button class="campaign-mode-btn ">
      <span class="campaign-mode-icon">🗺️</span>
      <span>World</span>
    </button>
    <button class="campaign-mode-btn ">
      <span class="campaign-mode-icon">🏠</span>
      <span>Haven</span>
    </button>
  </div>
  <div class="campaign-scenario-hud">
    <span class="campaign-pill is-current">Tidewater Descent</span>
    <span class="campaign-pill">Danger 3/10</span>
    <span class="campaign-pill">Camps 1/3</span>
    <span class="campaign-pill">Battles 2/6</span>
    <button class="campaign-action">Run</button>
    <button class="campaign-action danger">End</button>
    <button class="campaign-action danger" title="Discard without recording a report">Cancel</button>
  </div>
  <div class="campaign-modes-utility">
    <button class="campaign-util-btn ">Settings</button>
    <button class="campaign-util-btn ">Logs</button>
  </div>
</div>
