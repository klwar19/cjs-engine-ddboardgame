<body class="campaign-page">
  <div id="campaign-root" class="campaign-root">
    <div class="campaign-loading">Loading Campaign Mode...</div>

  <script src="js/ui/l2d-companion.js?v=peri-v2-expall"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.CJS.CampaignUI.init(document.getElementById('campaign-root'));
      window.CJS.ScenePlayer?.wireCampaign?.();
      if (window.CJS.L2DCompanion) {
        window.CJS.L2DCompanion.init({ mode: 'campaign' }).catch(err => console.warn('L2D init:', err));
      }
    });
  </script>
