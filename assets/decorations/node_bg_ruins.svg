    <path d="M180 320 L220 270 L260 290 L260 230 L320 250 L320 320 Z"/>
    <path d="M380 320 L440 260 L480 280 L500 240 L560 250 L560 320 Z"/>
    <path d="M600 320 L640 280 L680 290 L680 420 L600 420 Z"/>
