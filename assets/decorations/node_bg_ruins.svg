<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ruin-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2820"/>
      <stop offset="0.55" stop-color="#1a1610"/>
      <stop offset="1" stop-color="#0d0a06"/>
    </linearGradient>
    <radialGradient id="ruin-haze" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e2c889" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#a08854" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="680" height="420" fill="url(#ruin-sky)"/>
  <rect width="680" height="420" fill="url(#ruin-haze)"/>

  <!-- distant fallen wall silhouettes -->
  <g fill="#1f1a13" opacity="0.85">
