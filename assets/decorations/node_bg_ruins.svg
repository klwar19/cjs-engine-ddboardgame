      <rect x="-16" y="-6" width="32" height="10" fill="#766039" stroke="#1a1308" stroke-width="1.5"/>
      <rect x="-12" y="42" width="24" height="3" fill="#2c2317" opacity="0.7"/>
      <rect x="-12" y="80" width="24" height="3" fill="#2c2317" opacity="0.7"/>
    </g>
    <g transform="translate(470 210)">
      <rect x="-12" y="0" width="24" height="160" fill="#5d4d32" stroke="#1a1308" stroke-width="1.5"/>
      <rect x="-16" y="-6" width="32" height="10" fill="#766039" stroke="#1a1308" stroke-width="1.5"/>
      <rect x="-12" y="42" width="24" height="3" fill="#2c2317" opacity="0.7"/>
      <rect x="-12" y="90" width="24" height="3" fill="#2c2317" opacity="0.7"/>
      <rect x="-12" y="140" width="24" height="3" fill="#2c2317" opacity="0.7"/>
