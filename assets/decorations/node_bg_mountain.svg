<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mtn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2e44"/>
      <stop offset="0.55" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#06070a"/>
