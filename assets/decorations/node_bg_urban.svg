<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="urb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2236"/>
      <stop offset="0.55" stop-color="#161222"/>
      <stop offset="1" stop-color="#0a0712"/>
